<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple RAG</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f5f6f8; color: #1f2430; }
  header { background: #1f2430; color: #fff; padding: 14px 20px; font-size: 18px; }
  main { display: flex; gap: 16px; padding: 16px; max-width: 1200px; margin: 0 auto; align-items: flex-start; }
  .card { background: #fff; border: 1px solid #dde0e6; border-radius: 8px; padding: 16px; }
  #left { width: 320px; flex-shrink: 0; }
  #right { flex: 1; min-width: 0; }
  h2 { margin: 0 0 10px; font-size: 15px; }
  button { background: #3b6ef5; color: #fff; border: 0; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  button:disabled { background: #9aa8d6; cursor: wait; }
  button.small { background: #e5484d; padding: 3px 8px; font-size: 12px; }
  .doc { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eef0f3; font-size: 14px; }
  .doc .meta { color: #6b7280; font-size: 12px; }
  .muted { color: #6b7280; font-size: 13px; }
  #status { margin-top: 8px; font-size: 13px; min-height: 18px; }
  #askrow { display: flex; gap: 8px; }
  #question { flex: 1; padding: 10px; border: 1px solid #c8ccd4; border-radius: 6px; font-size: 15px; }
  .qa { margin-top: 16px; border-top: 1px solid #eef0f3; padding-top: 12px; }
  .q { font-weight: 600; margin-bottom: 6px; }
  .answer { white-space: pre-wrap; line-height: 1.5; background: #eef3ff; padding: 10px 12px; border-radius: 6px; }
  .error { color: #b42318; }
  details { margin-top: 8px; font-size: 13px; }
  summary { cursor: pointer; color: #3b6ef5; }
  .chunk { border: 1px solid #dde0e6; border-radius: 6px; padding: 8px; margin-top: 6px; }
  .chunk.ignored { opacity: .55; background: #fafafa; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; margin-left: 6px; }
  .used { background: #d1f5dc; color: #11632f; }
  .skip { background: #eee; color: #555; }
  .chunk .text { white-space: pre-wrap; margin-top: 4px; }
  pre { white-space: pre-wrap; background: #f1f3f6; padding: 8px; border-radius: 6px; font-size: 12px; }
</style>
</head>
<body>
<header>Simple RAG &middot; ask questions about your own documents</header>
<main>
  <section id="left" class="card">
    <h2>1. Add documents</h2>
    <input type="file" id="files" multiple accept=".pdf,.docx,.md,.txt">
    <div style="margin-top:8px"><button id="uploadBtn">Upload &amp; ingest</button></div>
    <div id="status" class="muted"></div>
    <h2 style="margin-top:18px">Your documents</h2>
    <div id="docs" class="muted">Loading...</div>
  </section>

  <section id="right" class="card">
    <h2>2. Ask a question</h2>
    <div id="askrow">
      <input id="question" placeholder="Ask something about your documents..." autofocus>
      <button id="askBtn">Ask</button>
    </div>
    <div id="log"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);

// small helper: build an element safely (textContent never runs HTML from documents)
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

// ---------- documents list ----------
async function loadDocs() {
  const docs = await (await fetch('/api/documents')).json();
  const box = $('docs');
  box.innerHTML = '';
  if (docs.length === 0) { box.textContent = 'No documents yet.'; return; }
  docs.forEach((d) => {
    const row = el('div', 'doc');
    const info = el('div');
    info.appendChild(el('div', '', d.name));
    info.appendChild(el('div', 'meta', `${d.chunks} chunks · ${d.size_kb} KB`));
    const del = el('button', 'small', 'Delete');
    del.onclick = async () => {
      await fetch('/api/documents/' + encodeURIComponent(d.name), { method: 'DELETE' });
      loadDocs();
    };
    row.appendChild(info);
    row.appendChild(del);
    box.appendChild(row);
  });
}

// ---------- upload ----------
$('uploadBtn').onclick = async () => {
  const files = $('files').files;
  if (!files.length) { $('status').textContent = 'Choose at least one file first.'; return; }
  const form = new FormData();
  for (const f of files) form.append('files', f);
  $('uploadBtn').disabled = true;
  $('status').textContent = 'Reading, chunking and embedding... (can take a minute)';
  try {
    const results = await (await fetch('/api/upload', { method: 'POST', body: form })).json();
    $('status').textContent = results
      .map((r) => (r.error ? `${r.name}: ${r.error}` : `${r.name}: ${r.chunks} chunks saved`))
      .join('\n');
    $('status').style.whiteSpace = 'pre-wrap';
    $('files').value = '';
  } catch (e) {
    $('status').textContent = 'Upload failed: ' + e;
  }
  $('uploadBtn').disabled = false;
  loadDocs();
};

// ---------- ask ----------
async function ask() {
  const question = $('question').value.trim();
  if (!question) return;
  $('askBtn').disabled = true;
  $('question').value = '';

  const block = el('div', 'qa');
  block.appendChild(el('div', 'q', 'You: ' + question));
  const ans = el('div', 'answer', 'Thinking...');
  block.appendChild(ans);
  $('log').prepend(block);

  try {
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question }),
    });
    const data = await res.json();
    if (data.error) { ans.textContent = data.error; ans.classList.add('error'); }
    else { ans.textContent = data.answer; renderDetails(block, data); }
  } catch (e) {
    ans.textContent = 'Request failed: ' + e;
    ans.classList.add('error');
  }
  $('askBtn').disabled = false;
  $('question').focus();
}

function renderDetails(block, data) {
  // what the retriever found
  const d1 = el('details');
  d1.appendChild(el('summary', '', `Retrieved chunks (${data.chunks.length})`));
  if (data.chunks.length === 0) d1.appendChild(el('div', 'muted', 'Nothing in the database yet.'));
  data.chunks.forEach((c) => {
    const box = el('div', 'chunk' + (c.used ? '' : ' ignored'));
    const head = el('div', '', `${c.source} · chunk ${c.chunk_index} · similarity ${c.score.toFixed(2)}`);
    head.appendChild(el('span', 'badge ' + (c.used ? 'used' : 'skip'), c.used ? 'sent to LLM' : 'below threshold'));
    box.appendChild(head);
    box.appendChild(el('div', 'text', c.text));
    d1.appendChild(box);
  });
  block.appendChild(d1);

  // the exact prompt the LLM received
  const d2 = el('details');
  d2.appendChild(el('summary', '', 'Prompt sent to the LLM'));
  d2.appendChild(el('pre', '', data.prompt
    ? data.prompt.map((m) => `[${m.role}]\n${m.content}`).join('\n\n')
    : 'No prompt was sent: no chunk passed the similarity threshold.'));
  block.appendChild(d2);
}

$('askBtn').onclick = ask;
$('question').addEventListener('keydown', (e) => { if (e.key === 'Enter') ask(); });
loadDocs();
</script>
</body>
</html>
